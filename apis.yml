aid: brickanta
name: Brickanta
description: >-
  Brickanta is a Stockholm-based agentic AI platform built for the construction
  industry, deploying specialized AI agents to automate pre-construction and
  project workflows including bid analysis, cost estimation, procurement package
  generation, document and contract review, compliance, and quality assurance.
  The platform reads drawings, specs, and contracts to surface risks and gaps,
  turns raw RFPs into discipline-specific procurement packages, and builds a
  searchable knowledge base from every finished project. Brickanta raised an $8M
  seed round led by Northzone in early 2026 and serves construction teams across
  eleven countries. The company exposes a customer application and a public trust
  portal but does not currently publish a public developer API, SDKs, or API
  reference; this profile captures its identity and security posture.
